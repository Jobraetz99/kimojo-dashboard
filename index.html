<script>

const MC={auth:{clientId:"9fe9cda7-79c3-4d06-82dc-372715bb8086",authority:"https://login.microsoftonline.com/3e5c8d47-8ccc-42f6-877d-0d0e72972e39",redirectUri:window.location.origin+window.location.pathname},cache:{cacheLocation:"sessionStorage"}};

const useRedirect=isMobile||(window.opener!==null)||(window.self!==window.top);

function parseDate(v){if(!v)return null;const s=String(v).trim();let m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);if(m){const y=m[3].length===2?2000+parseInt(m[3]):parseInt(m[3]);return new Date(y,parseInt(m[2])-1,parseInt(m[1]));}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]));if(typeof v==='number'&&v>40000){const d=new Date((v-25569)*86400000);if(!isNaN(d))return d;}return null;}

// Extrahiert Telefonnummer aus Patienten-Objekt — probiert diverse Feldnamen
function extractPhone(pRec){
  if(!pRec)return'';
  const fields=['TelefonMobil','Mobiltelefon','Handy','MobilTelefon','Mobile','TelefonPrivat','TelefonGeschaeftlich','Telefon','Telefon1','Telefon2','PhoneMobile','Phone'];
  for(const f of fields){if(pRec[f]&&String(pRec[f]).trim())return String(pRec[f]).trim();}
  if(pRec.Kontakt){for(const f of fields){if(pRec.Kontakt[f]&&String(pRec.Kontakt[f]).trim())return String(pRec.Kontakt[f]).trim();}}
  return'';
}

// Normalisiert Telefonnummer ins E.164-Format (+49...)
function normPhone(raw){
  if(!raw)return'';
  let s=String(raw).replace(/[^\d+]/g,'');
  if(!s)return'';
  if(s.startsWith('00'))s='+'+s.slice(2);
  else if(s.startsWith('0'))s='+49'+s.slice(1);
  else if(!s.startsWith('+'))s='+49'+s;
  return s;
}
// Liefert das korrekte Label für "morgen" — berücksichtigt Wochenende
// Fr → "Montag", Sa → "Montag", So → "Montag", sonst → "Morgen"
function getMorgenLabel(){
  const dow=new Date().getDay(); // 0=So, 5=Fr, 6=Sa
  if(dow===5||dow===6||dow===0)return'Montag';
  return'Morgen';
}

let feedbackKW=0; // Aktuell ausgewählte KW für Feedback-Liste
let feedbackStandort='all'; // Filter: alle / KIMOJO / PHFIP

// KW-Berechnung (ISO-8601, wie getCurrentKW, aber für beliebiges Datum)
function isoWeek(d){
  const date=new Date(d);date.setHours(0,0,0,0);
  date.setDate(date.getDate()+3-(date.getDay()+6)%7);
  const w1=new Date(date.getFullYear(),0,4);
  return 1+Math.round(((date.getTime()-w1.getTime())/864e5-3+(w1.getDay()+6)%7)/7);
}

// Sammelt alle Patienten, deren Rezept in gegebener KW abgeschlossen wurde
// und die aktuell keine zukünftigen Termine haben
function getFeedbackPatients(targetKW,targetYear){
  if(!behData||!Array.isArray(behData))return[];
  const plMap={};
  if(plData&&Array.isArray(plData))plData.forEach(p=>{if(p?.Id)plMap[p.Id]=p;});
  const today=new Date();today.setHours(0,0,0,0);
  const result=[];
  behData.forEach(p=>{
    const pid=p.patientId;if(!pid)return;
    const vos=(p.data?.Verordnungen||[]);
    // Prüfe alle Verordnungen: Welche wurden in target-KW komplett abgeschlossen?
    let lastFinishedVo=null,lastTerminDate=null,lastTherapeut='';
    let hasFutureTermin=false;
    vos.forEach(v=>{
      const te=v.Termine||[];if(!te.length)return;
      const open=te.filter(t=>t.Status===1).length;
      const done=te.filter(t=>t.Status===4).length;
      // Zukünftige geplante Termine (Status 1 mit Datum > heute)
      te.forEach(t=>{
        if(t.Status===1&&t.Datum){
          const d=new Date(t.Datum);
          if(d>=today)hasFutureTermin=true;
        }
      });
      // Rezept gilt als abgeschlossen: alle erbracht, keine offenen
      if(done>0&&open===0){
        // Letzter erbrachter Termin = Abschlussdatum
        const doneTe=te.filter(t=>t.Status===4&&t.Datum).map(t=>({d:new Date(t.Datum),n:t.MitarbeiterName||''}));
        if(!doneTe.length)return;
        doneTe.sort((a,b)=>b.d-a.d);
        const last=doneTe[0];
        const kw=isoWeek(last.d);const yr=last.d.getFullYear();
        if(kw===targetKW&&yr===targetYear){
          if(!lastTerminDate||last.d>lastTerminDate){
            lastTerminDate=last.d;lastFinishedVo=v;lastTherapeut=last.n;
          }
        }
      }
    });
    if(!lastFinishedVo||hasFutureTermin)return;
    // Patient hat abgeschlossenes Rezept in target-KW und keinen Folgetermin
    const pl=plMap[pid];
    const name=pl?((pl.Nachname||'')+', '+(pl.Vorname||'')):'Unbekannt';
    const vorname=pl?.Vorname||'';
    const nachname=pl?.Nachname||'';
    const phone=normPhone(extractPhone(pl||{}));
    const beschr=lastFinishedVo.Beschreibung||'';
    const ort=pl?.Ort||'';
    result.push({pid,name,vorname,nachname,phone,therapeut:lastTherapeut,lastDate:lastTerminDate,beschr,ort});
  });
  // Sortierung: nach Datum absteigend (neueste zuerst)
  result.sort((a,b)=>b.lastDate-a.lastDate);
  return result;
}

function changeFeedbackKW(d){
  const curKW=getCurrentKW();

  feedbackKW=Math.max(1,Math.min(curKW,feedbackKW+d));
  const el=document.getElementById('fbKwTitle');if(el)el.textContent='KW '+feedbackKW;
  renderFeedbackList();
}

function renderFeedbackList(){
  const el=document.getElementById('fbContainer');if(!el)return;

  const pts=getFeedbackPatients(feedbackKW,curYear);
  // Filter nach Standort (aus Patientenort ableitbar, aber besser aus letzter Excel-Zeile vom analyzePatients; hier nutzen wir overduePatients-Standorte als Lookup)
  const standortByName={};
  if(overduePatients&&overduePatients.length){
    overduePatients.forEach(op=>{standortByName[op.patient.toLowerCase()]=op.standort;});
  }
  pts.forEach(p=>{p.standort=standortByName[p.name.toLowerCase()]||'—';});
  const filtered=feedbackStandort==='all'?pts:pts.filter(p=>{
    if(feedbackStandort==='KIMOJO')return p.standort.startsWith('KIMOJO')||p.standort==='Ergotherapie';
    if(feedbackStandort==='PHFIP')return p.standort==='PHFIP';
    return true;
  });
  const infoEl=document.getElementById('fbKwInfo');
  if(infoEl){
    const curKW=getCurrentKW();
    const label=feedbackKW===curKW?'Aktuelle KW':(feedbackKW===curKW-1?'Letzte KW':'KW '+feedbackKW);
    infoEl.textContent=label+' · '+pts.length+' abgeschlossene Rezepte';
  }
  // KPI-Karten
  const mitTel=pts.filter(p=>p.phone).length;
  const ohneTel=pts.length-mitTel;
  let h='';

let zuweiserSource='ergo'; // aktuell: 'ergo' (später: 'physio', 'phfip', 'all')
let zuweiserSort='count';   // 'count' / 'patients' / 'name' / 'blanko'

// Manuell gepflegte Arzt-Namen (Key = LANR oder ArztId)
const arztNamesManual=JSON.parse(localStorage.getItem('arztNames')||'{}');
function saveArztName(key,name){
  const t=(name||'').trim();
  if(t)arztNamesManual[key]={name:t,updated:Date.now()};
  else delete arztNamesManual[key];
  localStorage.setItem('arztNames',JSON.stringify(arztNamesManual));
}
// Inline-Edit: User trägt Name ein → wird sofort gespeichert + Tabelle re-rendert
window.editArztName=function(key,inputEl){
  const newName=(inputEl.value||'').trim();
  saveArztName(key,newName);
  renderZuweiserTable();
};

// Sammelt alle Verordnungen pro Arzt aus einer Datenquelle.
// Aktuell nur ergoDetailData. Strukturiert so, dass weitere Quellen leicht ergänzbar sind.
function getZuweiserData(source){
  const arzte={};
  const today=new Date();today.setHours(0,0,0,0);

  // Helper: VO + Arzt-Info hinzufügen
  function addVerordnung(arztKey,arztName,arztDetails,vo){
    if(!arzte[arztKey]){
      arzte[arztKey]={
        key:arztKey,
        name:arztName||'Unbekannt',
        lanr:arztDetails.lanr||'',
        bsnr:arztDetails.bsnr||'',
        arztId:arztDetails.arztId||'',
        verordnungen:[],
        patientIds:new Set(),
        diagnosegruppen:new Set(),
        bereiche:new Set(),
        blankoCount:0,
        firstDate:null,
        lastDate:null
      };
    }
    const a=arzte[arztKey];
    a.verordnungen.push(vo);
    if(vo.patientId)a.patientIds.add(vo.patientId);
    if(vo.diagnosegruppe)a.diagnosegruppen.add(vo.diagnosegruppe);
    if(vo.bereich)a.bereiche.add(vo.bereich);
    if(vo.isBlanko)a.blankoCount++;
    if(vo.datum){
      const d=new Date(vo.datum);
      if(!a.firstDate||d<a.firstDate)a.firstDate=d;
      if(!a.lastDate||d>a.lastDate)a.lastDate=d;
    }
  }

  // ── ERGO-Datenquelle ──
  if((source==='ergo'||source==='all')&&ergoDetailData&&Array.isArray(ergoDetailData)){
    ergoDetailData.forEach(e=>{
      const vo=e.Verordnung;if(!vo)return;
      const det=vo.Details||{};
      const lanr=det.LebenslangeArztnummer||'';
      const arztId=det.ArztId||'';
      const arztNameRaw=e.ReadOnlyInformation?.Arzt||'';
      // Key bevorzugt LANR (eindeutig), fallback ArztId, fallback Name
      const key=lanr||arztId||arztNameRaw||'unknown';
      if(key==='unknown'&&!arztNameRaw)return; // keine Arzt-Info → skip
      // Manuell gepflegter Name hat Vorrang
      const arztName=arztNamesManual[key]?.name||arztNameRaw;
      const pat=vo.Patient;
      const heilmittel=(e.VerordneteHeilmittel||[]).map(hm=>hm.Bezeichnung||hm.Kurzbezeichnung).filter(Boolean);
      const voEntry={
        id:vo.Id,
        bereich:'Ergo',
        datum:det.Datum||null,
        diagnosegruppe:det.Diagnosegruppe||'',
        icd10:det.Icd10Code||det.BehandlungsrelevanteDiagnose||'',
        beschreibung:heilmittel.join(', ')||'—',
        heilmittel,
        isBlanko:!!det.IsBlankoformular,
        isReadOnly:!!vo.IsReadOnly,
        patientId:pat?.Id||'',
        patientName:pat?((pat.Nachname||'')+', '+(pat.Vorname||'')).trim():'',
        patientGeb:pat?.Geburtsdatum||'',
        patientOrt:pat?.Ort||''
      };
      addVerordnung(key,arztName,{lanr,bsnr:det.Betriebsstaettennummer||'',arztId},voEntry);
    });
  }

  return Object.values(arzte);
}

function renderZuweiserTable(){
  const el=document.getElementById('zuweiserTable');if(!el)return;
  const allArzte=getZuweiserData(zuweiserSource);
  // Zeitraum-Filter: filtere Verordnungen pro Arzt nach Datum
  const now=new Date();const thisMonth=new Date(now.getFullYear(),now.getMonth(),1);
  const lastMonth=new Date(now.getFullYear(),now.getMonth()-1,1);
  const last3=new Date(now.getFullYear(),now.getMonth()-3,1);
  const filtered=allArzte.map(a=>{
    let vos=a.verordnungen;
    if(zuweiserPeriod!=='all'){
      vos=vos.filter(v=>{
        if(!v.datum)return false;
        const d=new Date(v.datum);
        if(zuweiserPeriod==='thisMonth')return d>=thisMonth;
        if(zuweiserPeriod==='lastMonth')return d>=lastMonth&&d<thisMonth;
        if(zuweiserPeriod==='last3')return d>=last3;
        return true;
      });
    }
    // Recompute KPIs für gefilterten Zeitraum
    const patientIds=new Set();const dgs=new Set();let blankoCnt=0;
    vos.forEach(v=>{if(v.patientId)patientIds.add(v.patientId);if(v.diagnosegruppe)dgs.add(v.diagnosegruppe);if(v.isBlanko)blankoCnt++;});
    return{...a,verordnungenFiltered:vos,countFiltered:vos.length,patientCountFiltered:patientIds.size,dgsFiltered:[...dgs],blankoFiltered:blankoCnt};
  }).filter(a=>a.countFiltered>0);
  // Sortieren
  filtered.sort((a,b)=>{
    if(zuweiserSort==='name')return a.name.localeCompare(b.name);
    if(zuweiserSort==='patients')return b.patientCountFiltered-a.patientCountFiltered;
    if(zuweiserSort==='blanko')return(b.blankoFiltered/b.countFiltered)-(a.blankoFiltered/a.countFiltered);
    return b.countFiltered-a.countFiltered;
  });
  // Trend-Berechnung: Vergleich Verordnungen aktueller Monat vs Vormonat
  filtered.forEach(a=>{
    const cur=a.verordnungen.filter(v=>{if(!v.datum)return false;const d=new Date(v.datum);return d>=thisMonth;}).length;
    const prev=a.verordnungen.filter(v=>{if(!v.datum)return false;const d=new Date(v.datum);return d>=lastMonth&&d<thisMonth;}).length;
    a.trendCur=cur;a.trendPrev=prev;
    a.trendDelta=prev>0?Math.round((cur-prev)/prev*100):(cur>0?100:0);
  });
  // KPIs gesamt
  const totalArzte=filtered.length;
  const totalRezepte=filtered.reduce((s,a)=>s+a.countFiltered,0);
  const totalPatienten=new Set();filtered.forEach(a=>a.verordnungenFiltered.forEach(v=>{if(v.patientId)totalPatienten.add(v.patientId);}));
  const blankoTotal=filtered.reduce((s,a)=>s+a.blankoFiltered,0);
  const blankoQuote=totalRezepte>0?Math.round(blankoTotal/totalRezepte*100):0;
  let h='';
  h+='<div class="hero">';
  h+='<div class="hk"><div class="hk-l">Aktive Zuweiser</div><div class="hk-v" style="color:var(--red)">'+totalArzte+'</div><div class="hk-sub">Ärzte mit Rezepten</div></div>';
  h+='<div class="hk"><div class="hk-l">Rezepte gesamt</div><div class="hk-v">'+totalRezepte+'</div><div class="hk-sub">im Zeitraum</div></div>';
  h+='<div class="hk"><div class="hk-l">Patienten gesamt</div><div class="hk-v" style="color:var(--teal)">'+totalPatienten.size+'</div><div class="hk-sub">unique</div></div>';
  h+='<div class="hk"><div class="hk-l">Blanko-Quote</div><div class="hk-v" style="color:var(--purple)">'+blankoQuote+'%</div><div class="hk-sub">'+blankoTotal+' Blanko-VOs</div></div>';
  h+='</div>';
  // Top-3-Highlight (nur bei Sortierung nach count und mind. 3 Ärzten)
  if(zuweiserSort==='count'&&filtered.length>=3){
    h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px">';
    const podium=['🥇','🥈','🥉'];
    filtered.slice(0,3).forEach((a,i)=>{
      const trendIcon=a.trendDelta>0?'📈':a.trendDelta<0?'📉':'➡️';
      const trendCol=a.trendDelta>0?'var(--teal)':a.trendDelta<0?'var(--red)':'var(--muted)';
      h+=`<div style="background:linear-gradient(135deg,var(--card),#fafaf8);border:1.5px solid var(--border);border-radius:16px;padding:16px;cursor:pointer" onclick="showZuweiserDetail('${escA(a.key)}')">`;
      h+=`<div style="font-size:24px;margin-bottom:4px">${podium[i]}</div>`;
      h+=`<div style="font-family:Montserrat;font-size:14px;font-weight:800;line-height:1.2">${esc(a.name)}</div>`;
      if(a.lanr)h+=`<div style="font-size:9px;color:var(--muted);margin-top:2px">LANR: ${esc(a.lanr)}</div>`;
      h+=`<div style="display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)">`;
      h+=`<div><div style="font-size:9px;color:var(--muted)">REZEPTE</div><div style="font-family:Montserrat;font-size:18px;font-weight:900">${a.countFiltered}</div></div>`;
      h+=`<div><div style="font-size:9px;color:var(--muted)">PATIENTEN</div><div style="font-family:Montserrat;font-size:18px;font-weight:900">${a.patientCountFiltered}</div></div>`;
      h+=`<div><div style="font-size:9px;color:var(--muted)">TREND</div><div style="font-family:Montserrat;font-size:13px;font-weight:800;color:${trendCol}">${trendIcon} ${a.trendDelta>0?'+':''}${a.trendDelta}%</div></div>`;
      h+=`</div></div>`;
    });
    h+='</div>';
  }
  if(!filtered.length){
    h+='<div class="tcx"><div class="wl-empty">Keine Daten im Zeitraum</div></div>';
    el.innerHTML=h;return;
  }
  // Hauptliste
  h+='<div class="tcx"><div class="thd"><h3>Alle Zuweiser</h3><span class="cnt">'+filtered.length+' Ärzte</span></div>';
  h+='<table class="data-t"><thead><tr><th>#</th><th>Arzt</th><th>LANR</th><th class="r">Rezepte</th><th class="r">Patienten</th><th class="r">Blanko %</th><th class="r">Trend</th><th>Diagnosegruppen</th><th></th></tr></thead><tbody>';
  filtered.forEach((a,i)=>{
    const blPercent=a.countFiltered>0?Math.round(a.blankoFiltered/a.countFiltered*100):0;
    const trendIcon=a.trendDelta>0?'📈':a.trendDelta<0?'📉':'➡️';
    const trendCol=a.trendDelta>0?'var(--teal)':a.trendDelta<0?'var(--red)':'var(--muted)';
    const dgBadges=a.dgsFiltered.slice(0,4).map(dg=>`<span class="pr-b c-blue">${esc(dg)}</span>`).join('');
    const moreD=a.dgsFiltered.length>4?` <span style="font-size:9px;color:var(--muted)">+${a.dgsFiltered.length-4}</span>`:'';
    // Unbekannte Ärzte: Inline-Edit-Feld + Google-Such-Button
    const isUnknown=(a.name==='Unbekannt'||!a.name);
    let arztCell;
    if(isUnknown){
      const googleQuery=encodeURIComponent('LANR '+a.lanr+(a.bsnr?' BSNR '+a.bsnr:'')+' Arzt');
      arztCell=`<div onclick="event.stopPropagation()" style="display:flex;flex-direction:column;gap:3px">`;
      arztCell+=`<input type="text" placeholder="Name eintragen..." onblur="editArztName('${escA(a.key)}',this)" onkeydown="if(event.key==='Enter')this.blur()" style="padding:4px 8px;border:1.5px solid var(--amber);border-radius:6px;font-size:11px;font-family:Poppins;outline:none;width:160px;background:var(--amber-bg)">`;
      arztCell+=`<a href="https://www.google.com/search?q=${googleQuery}" target="_blank" rel="noopener" style="font-size:9px;color:var(--blue);text-decoration:none;font-family:Montserrat;font-weight:700">🔎 LANR googeln</a>`;
      arztCell+=`</div>`;
    }else{
      // Bekannter Arzt: zeige Name, ggf. mit "manuell"-Badge wenn aus localStorage
      const isManual=!!arztNamesManual[a.key];
      arztCell=`<div class="pn">${esc(a.name)}${isManual?' <span style="font-size:8px;color:var(--teal);font-weight:600">●</span>':''}</div>`;
    }
    h+=`<tr style="cursor:pointer" onclick="showZuweiserDetail('${escA(a.key)}')">`;
    h+=`<td><strong>${i+1}</strong></td>`;
    h+=`<td>${arztCell}</td>`;
    h+=`<td><span style="font-family:'SF Mono',Menlo,monospace;font-size:10px;color:var(--muted)">${esc(a.lanr||'—')}</span></td>`;
    h+=`<td class="r"><strong>${a.countFiltered}</strong></td>`;
    h+=`<td class="r">${a.patientCountFiltered}</td>`;
    h+=`<td class="r"><span class="badge ${blPercent>=50?'b-amber':'b-teal'}" style="font-weight:600">${blPercent}%</span></td>`;
    h+=`<td class="r" style="color:${trendCol};font-family:Montserrat;font-weight:700">${trendIcon} ${a.trendDelta>0?'+':''}${a.trendDelta}%</td>`;
    h+=`<td><div class="pr-bs" style="max-width:200px;justify-content:flex-start">${dgBadges}${moreD}</div></td>`;
    h+=`<td><button class="act">Details ▶</button></td>`;
    h+=`</tr>`;
  });
  h+='</tbody></table></div>';
  // Detail-Bereich (initial leer)
  h+='<div id="zuweiserDetail"></div>';
  el.innerHTML=h;
}

function showZuweiserDetail(arztKey){
  const allArzte=getZuweiserData(zuweiserSource);
  const arzt=allArzte.find(a=>a.key===arztKey);
  const el=document.getElementById('zuweiserDetail');if(!el||!arzt)return;
  // Zeitraum-Filter auch hier anwenden
  const now=new Date();const thisMonth=new Date(now.getFullYear(),now.getMonth(),1);
  const lastMonth=new Date(now.getFullYear(),now.getMonth()-1,1);
  const last3=new Date(now.getFullYear(),now.getMonth()-3,1);
  let vos=arzt.verordnungen;
  if(zuweiserPeriod!=='all'){
    vos=vos.filter(v=>{if(!v.datum)return false;const d=new Date(v.datum);
      if(zuweiserPeriod==='thisMonth')return d>=thisMonth;
      if(zuweiserPeriod==='lastMonth')return d>=lastMonth&&d<thisMonth;
      if(zuweiserPeriod==='last3')return d>=last3;
      return true;
    });
  }
  // Sortiere VOs nach Datum desc
  vos.sort((a,b)=>{const da=a.datum?new Date(a.datum):0;const db=b.datum?new Date(b.datum):0;return db-da;});
  // Patienten-Aggregation
  const byPatient={};
  vos.forEach(v=>{
    const pid=v.patientId||v.patientName;if(!pid)return;
    if(!byPatient[pid])byPatient[pid]={name:v.patientName,geb:v.patientGeb,ort:v.patientOrt,verordnungen:[]};
    byPatient[pid].verordnungen.push(v);
  });

// ═══════════════════════════════════════════════════════════
// DAY ANALYSIS (Tages-Briefing)
// ═══════════════════════════════════════════════════════════
function mergeR(ranges){if(!ranges.length)return[];ranges.sort((a,b)=>a[0]-b[0]);const m=[[ranges[0][0],ranges[0][1]]];for(let i=1;i<ranges.length;i++){const l=m[m.length-1];if(ranges[i][0]<=l[1]){if(ranges[i][1]>l[1])l[1]=ranges[i][1];}else m.push([ranges[i][0],ranges[i][1]]);}return m;}
function rSum(m){return m.reduce((s,r)=>(r[1]-r[0])/6e4+s,0);}
function pTime(ds,ts){const d=new Date(ds+'T'+ts);if(isNaN(d)){const p=ts.split(':');return new Date(new Date(ds).setHours(+p[0],+p[1],p[2]?+p[2]:0));}return d;}

function analyzeDay(tp,az){
  if(!tp||!tp.length)return{act:[],absent:[],tgm:0,tp2:0,aA:0,twg:0,ps:0,ds:'Keine Daten'};
  const ds=tp[0].Beginn.slice(0,10);const dd=new Date(ds+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  // Schutz: wenn AZ-Datei ein anderes Datum hat (z.B. Samstag statt Montag am Freitag),
  // ist sie unbrauchbar → ignorieren und Arbeitszeiten aus TP ableiten
  let azValid=az;
  if(az&&az.length&&az[0].OnDay&&az[0].OnDay!==ds){
    console.warn(`AZ-Datum (${az[0].OnDay}) stimmt nicht mit TP-Datum (${ds}) überein — AZ wird ignoriert`);
    azValid=null;
  }
  const azById={};if(azValid)azValid.forEach(a=>{azById[a.Id]={az:a.Arbeitszeiten||[],absent:a.IstAbwesend,label:a.Abwesenheitsbezeichnung};});
  const IGNORE=['Christine Franz'];
  const T={};tp.forEach(t=>{(t.Mitarbeiter||[]).forEach(m=>{const id=m.Id,vn=(m.Vorname||'').trim(),nn=(m.Nachname||'').trim();if(!vn)return;if(IGNORE.some(n=>n.toLowerCase()===(vn+' '+nn.replace(/\s*\(.*?\)\s*/g,'').trim()).toLowerCase()))return;if(!T[id])T[id]={vn,nn,dn:vn+' '+nn.replace(/\s*\(.*?\)\s*/g,'').trim(),ar:[],pc:0};T[id].ar.push([new Date(t.Beginn),new Date(t.Ende)]);if(t.PatientId||t.Art===1||t.Art===4)T[id].pc++;});});
  const res=[],absent=[];
  Object.entries(T).forEach(([id,th])=>{
    const ai=azById[id];if(ai&&ai.absent){absent.push({name:th.dn,reason:ai.label||'Abwesend'});return;}
    const azB=[];if(ai&&ai.az.length){ai.az.forEach(a=>{const s=pTime(ds,a.Start),e=pTime(ds,a.Ende);if(!isNaN(s)&&!isNaN(e))azB.push([s,e]);});azB.sort((a,b)=>a[0]-b[0]);}
    if(!azB.length&&!th.ar.length)return;
    const am=th.ar.length?mergeR(th.ar.map(r=>[new Date(r[0]),new Date(r[1])])):[];
    const gaps=[];let gt=0,twm=rSum(azB),pm=0;
    if(azB.length){
      azB.forEach(([s,e])=>{let c=s;am.forEach(([aS,aE])=>{if(aE<=s||aS>=e)return;const cs=new Date(Math.max(aS,s)),ce=new Date(Math.min(aE,e));if(cs>c){const g=(cs-c)/6e4;if(g>=MG){gaps.push({start:c,end:cs,min:g});gt+=g;}}c=new Date(Math.max(c,ce));});if(c<e){const g=(e-c)/6e4;if(g>=MG){gaps.push({start:c,end:e,min:g});gt+=g;}}});
      const pr=[];tp.forEach(t=>{if(!(t.Mitarbeiter||[]).some(m=>m.Id===id))return;if(t.PatientId||t.Art===1||t.Art===4)pr.push([new Date(t.Beginn),new Date(t.Ende)]);});const pM=pr.length?mergeR(pr):[];azB.forEach(([s,e])=>{pM.forEach(([pS,pE])=>{const os=Math.max(s,pS),oe=Math.min(e,pE);if(oe>os)pm+=(oe-os)/6e4;});});
    }else{
      // Fallback: keine AZ verfügbar → Schicht aus Terminen ableiten
      if(th.pc===0)return;
      if(am.length){
        // Schicht = erster Termin-Start bis letzter Termin-Ende
        const shiftStart=am[0][0],shiftEnd=am[am.length-1][1];
        // Lücken innerhalb der Schicht finden (zwischen den Terminen)
        let c=shiftStart;
        am.forEach(([aS,aE])=>{
          if(aS>c){const g=(aS-c)/6e4;if(g>=MG){gaps.push({start:c,end:aS,min:g});gt+=g;}}
          if(aE>c)c=aE;
        });
        twm=(shiftEnd-shiftStart)/6e4;
        pm=rSum(am);
      }
    }
    const au=twm>0?Math.min(100,Math.round(pm/twm*100)):(th.pc>0?100:0);
    const dS=azB.length?azB[0][0]:(am.length?am[0][0]:null),dE=azB.length?azB[azB.length-1][1]:(am.length?am[am.length-1][1]:null);
    if(!dS)return;res.push({name:th.dn,ds:dS,de:dE,wm:twm,pm,pc:th.pc,au,gaps,gt,azB,am});
  });
  res.sort((a,b)=>b.gt-a.gt);
  return{act:res,absent,tgm:res.reduce((s,t)=>s+t.gt,0),tp2:res.reduce((s,t)=>s+t.pc,0),aA:res.length?Math.round(res.reduce((s,t)=>s+t.au,0)/res.length):0,twg:res.filter(t=>t.gt>0).length,ps:Math.floor(res.reduce((s,t)=>s+t.gt,0)/20),ds:dd};
}

const BVB_LVB={'G10':{t:'LVB',n:'Chorea Huntington',vo:'dauerhaft'},'G11':{t:'LVB',n:'Hereditäre Ataxie',vo:'dauerhaft'},'G12':{t:'LVB',n:'Spinale Muskelatrophie/ALS',vo:'dauerhaft'},'G14':{t:'LVB',n:'Postpoliosyndrom',vo:'dauerhaft'},'G20.1':{t:'LVB',n:'Parkinson St.3-4',vo:'dauerhaft'},'G20.2':{t:'LVB',n:'Parkinson St.5',vo:'dauerhaft'},'G24.3':{t:'BVB',n:'Torticollis spasticus',vo:'12 Wochen'},'G35':{t:'LVB',n:'Multiple Sklerose',vo:'dauerhaft'},'G36':{t:'LVB',n:'Demyelinisation',vo:'dauerhaft'},'G37':{t:'LVB',n:'Demyelinisierende Krankheit',vo:'dauerhaft'},'G60.0':{t:'LVB',n:'Hereditäre Neuropathie',vo:'dauerhaft'},'G61.0':{t:'BVB',n:'Guillain-Barré',vo:'12 Wochen'},'G61.8':{t:'BVB',n:'CIDP',vo:'12 Wochen'},'G70.0':{t:'LVB',n:'Myasthenia gravis',vo:'dauerhaft'},'G71.0':{t:'LVB',n:'Muskeldystrophie',vo:'dauerhaft'},'G80':{t:'LVB',n:'Infantile Zerebralparese',vo:'dauerhaft'},'G81':{t:'LVB',n:'Hemiparese/Hemiplegie',vo:'dauerhaft'},'G82':{t:'LVB',n:'Para-/Tetraplegie',vo:'dauerhaft'},'G91.2':{t:'LVB',n:'Normaldruckhydrozephalus',vo:'dauerhaft'},'G93.1':{t:'LVB',n:'Anoxische Hirnschädigung',vo:'dauerhaft'},'G93.80':{t:'LVB',n:'Apallisches Syndrom',vo:'dauerhaft'},'G95.0':{t:'LVB',n:'Syringomyelie',vo:'dauerhaft'},'I60':{t:'BVB',n:'Subarachnoidalblutung',h:'1J',vo:'12 Wochen'},'I61':{t:'BVB',n:'Intrazerebrale Blutung',h:'1J',vo:'12 Wochen'},'I63':{t:'BVB',n:'Hirninfarkt',h:'1J',vo:'12 Wochen'},'I64':{t:'BVB',n:'Schlaganfall',h:'1J',vo:'12 Wochen'},'I69':{t:'BVB',n:'Folgen zerebrovask. Krankheit',h:'1J',vo:'12 Wochen'},'M45':{t:'LVB',n:'Spondylitis ankylosans',vo:'dauerhaft'},'M05':{t:'BVB',n:'Seropositive RA',vo:'12 Wochen'},'M06':{t:'BVB',n:'Rheumatoide Arthritis',vo:'12 Wochen'},'I89.02':{t:'BVB',n:'Lymphödem Stadium II',vo:'12 Wochen'},'I89.03':{t:'BVB',n:'Lymphödem Stadium III',vo:'12 Wochen'},'I89.01':{t:'KEIN',n:'Lymphödem Stadium I — KEIN BVB'},'I89.09':{t:'BVB',n:'Lymphödem (Stadium prüfen!)',vo:'12 Wochen',h:'Stadium spezifizieren'},'U09.9':{t:'BVB',n:'Post-COVID',h:'zeitlich begrenzt',vo:'12 Wochen'},'Z98.88':{t:'BVB',n:'Z.n. OP Skelett',h:'6 Monate',vo:'12 Wochen'}};
function isBP(c){if(!c)return false;return c.startsWith('M75')||c.startsWith('S42')||c.startsWith('S43')||c.startsWith('S46')||c.startsWith('T92')||['M19.01','M19.11','M19.21','M19.91'].includes(c);}
function isPO(c){return c&&(c.startsWith('Z98')||c.startsWith('Z96'));}
function fBVB(c){if(!c)return null;if(BVB_LVB[c])return BVB_LVB[c];const x=c.replace(/-$/,'');if(BVB_LVB[x])return BVB_LVB[x];const p=x.split('.');if(p.length>=2){const k=p[0]+'.'+p[1].charAt(0);if(BVB_LVB[k])return BVB_LVB[k];}if(BVB_LVB[p[0]])return BVB_LVB[p[0]];return null;}
function aFreq(t){if(!t||t.length<3)return null;const d=t.map(x=>new Date(x.Datum)).sort((a,b)=>a-b);const iv=[];for(let i=1;i<d.length;i++){const df=Math.round((d[i]-d[i-1])/864e5);if(df>0)iv.push(df);}if(!iv.length)return null;const a=iv.reduce((s,v)=>s+v,0)/iv.length;return{avg:Math.round(a),pw:Math.round(7/a*10)/10};}
function hMHM(act){const ty=new Set();act.forEach(v=>{const b=v.Beschreibung||'';if(b.match(/Krankengymnastik|KG/i))ty.add('KG');if(b.match(/MLD|Lymphdrainage/i))ty.add('MLD');if(b.match(/Manuelle Therapie|MT/i))ty.add('MT');if(b.match(/KGG|Gerätegestützte/i))ty.add('KGG');});return ty.size>=2?[...ty]:null;}
function buildErgoDGMap(ergoDet){const m={};if(!ergoDet||!Array.isArray(ergoDet))return m;ergoDet.forEach(e=>{const vo=e.Verordnung;if(!vo||!vo.Id||!vo.Details)return;const dg=vo.Details.Diagnosegruppe;if(dg)m[vo.Id]=dg;});return m;}

const HM_DAUER={'KG':20,'KG - Einzelbehandlung':20,'KG-Atemtherapie':20,'MT':20,'MT - Einzel':20,'Manuelle Therapie':20,'MLD-30':30,'MLD':30,' MLD 30':30,'MLD-45':40,'MLD-60':60,'KGG':60,'KG-Gerät':60,'KG-ZNS (PNF)':30,'KG-ZNS (Bobath)':30,'Wärme':10,'Warmpackungen':10,'Traktion':10,'Motorisch-funkt. Beh.':30,'Motorisch-funkt. Beh., 2 ZI':60,'Motorisch-funkt. Beh., 4 ZI':60,'Sensomotorisch-perz. Beh.':45,'Psychisch-funkt. Beh.':60,'Psychisch-funkt. Beh., 2 ZI':60,'Psychisch-funkt. Beh., 3 ZI':60,'HLT/neuropsychologisch':30,'HLT/neuropsychologisch, 2 ZI':30,'HLT/neuropsychologisch, 4 ZI':60,'Blankoverordnung':60};
function getHMDauer(bez){if(!bez)return 20;if(HM_DAUER[bez])return HM_DAUER[bez];const bl=bez.toLowerCase();if(bl.includes('mld')&&bl.includes('60'))return 60;if(bl.includes('mld')&&bl.includes('45'))return 40;if(bl.includes('mld')&&bl.includes('30'))return 30;if(bl.includes('mld'))return 30;if(bl.includes('kgg')||bl.includes('gerät'))return 60;if(bl.includes('sensomotorisch'))return 45;if(bl.includes('psychisch'))return 60;if(bl.includes('motorisch-funkt'))return 30;if(bl.includes('hlt')||bl.includes('hirnleistung'))return 30;if(bl.includes('mt')||bl.includes('manuelle'))return 20;if(bl.includes('kg'))return 20;if(bl.includes('wärme')||bl.includes('warm')||bl.includes('traktion'))return 10;return 20;}
function analyzeTimePattern(termine){if(!termine||termine.length<2)return null;let vm=0,nm=0;termine.forEach(t=>{const d=new Date(t.Datum||t.beginn||t);const h=d.getHours();if(h<12)vm++;else nm++;});const total=vm+nm;if(total<2)return null;if(vm/total>=0.7)return'vm';if(nm/total>=0.7)return'nm';return null;}

function showGapNR(gapMin,btn,thName,gapStart){
  const el=document.getElementById('gapNR');if(!el)return;
  document.querySelectorAll('.ac-p').forEach(b=>b.style.background='');
  btn.style.background='var(--fire-bg)';
  if(!RC||!RC.nr.length){el.innerHTML='<div style="padding:12px;color:var(--muted);font-size:11px">Keine Nachrücker verfügbar</div>';return;}
  const gapH=gapStart?new Date(gapStart).getHours():12;const isVM=gapH<12;
  // Tracking für Transparenz: warum wurde ein Patient ausgefiltert?
  let rejectedFreq=0,rejectedTherapeut=0;
  const scored=RC.nr.map(it=>{
    let bonus=0;const hints=[];
    const dauer=it._hmDauer||20;
    if(dauer>gapMin){return{...it,_gapScore:-1,_hints:['⛔ '+dauer+'min passt nicht'],_rejectReason:'dauer'};}
    if(dauer<=gapMin)hints.push('✓ '+dauer+'min');
    // HARD-FILTER 1: Frequenz ≥ 2/Woche → Patient kommt schon oft genug, nicht mehr vorschlagen
    if(it._freqPerWeek&&it._freqPerWeek>=2){rejectedFreq++;return{...it,_gapScore:-2,_hints:['📈 Kommt schon '+it._freqPerWeek+'x/Wo'],_rejectReason:'freq'};}
    // HARD-FILTER 2: Stammtherapeut-Check — Patient muss diesen Therapeut schonmal gehabt haben
    // Robustes Token-Matching: ignoriert Reihenfolge ("Nüßlein, Vanessa" vs "Vanessa Nüßlein"),
    // Klammern-Suffixe ("(Physio - PhFiP)") und Komma-Trennung.
    // Match wenn ALLE relevanten Tokens des kürzeren Namens im längeren vorkommen.
    if(thName&&it._thHistory&&it._thHistory.length){
      const tokenize=s=>String(s||'').toLowerCase()
        .replace(/\(.*?\)/g,'')         // Klammer-Inhalte raus: (Physio - #2)
        .replace(/[,]/g,' ')            // Kommas zu Leerzeichen
        .split(/\s+/)                   // Split auf Whitespace
        .map(t=>t.trim())
        .filter(t=>t.length>=2);        // Mind. 2 Zeichen, ignoriere leer/Müll
      const thTokens=tokenize(thName);
      const match=it._thHistory.some(n=>{
        const nTokens=tokenize(n);
        if(!thTokens.length||!nTokens.length)return false;
        // Mindestens 2 Tokens müssen matchen (typisch Vor- + Nachname)
        // ODER bei kurzen Namen (1 Token): mindestens 1 muss matchen
        const matched=thTokens.filter(t=>nTokens.includes(t)).length;
        const minRequired=Math.min(2,Math.min(thTokens.length,nTokens.length));
        return matched>=minRequired;
      });
      if(!match){rejectedTherapeut++;return{...it,_gapScore:-3,_hints:['👤 Kein Bezug zu '+thName],_rejectReason:'therapeut'};}
      bonus+=2;hints.push('👤 Stammtherapeut');
    }else if(thName){
      // Keine Therapeut-Historie bekannt → sicherheitshalber raus (kein "Neuer Therapeut")
      rejectedTherapeut++;return{...it,_gapScore:-3,_hints:['👤 Keine Historie mit '+thName],_rejectReason:'therapeut'};
    }
    if(it._timePat){if(it._timePat==='vm'&&isVM){bonus+=1;hints.push('🕐 VM-Patient');}else if(it._timePat==='nm'&&!isVM){bonus+=1;hints.push('🕐 NM-Patient');}else if(it._timePat==='vm'&&!isVM){bonus-=1;hints.push('⚠ eher VM');}else if(it._timePat==='nm'&&isVM){bonus-=1;hints.push('⚠ eher NM');}}
    return{...it,_gapScore:it.score+bonus,_hints:hints};
  });
  const fits=scored.filter(x=>x._gapScore>=0).sort((a,b)=>b._gapScore-a._gapScore);
  const noFit=scored.filter(x=>x._gapScore<0);
  const top=fits.slice(0,10);
  let h=`<div style="margin-top:8px;padding:14px;background:var(--fire-bg);border-radius:16px;border:1px solid rgba(239,68,68,.15)">`;
  h+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><span style="font-family:Montserrat;font-size:12px;font-weight:800;color:var(--fire)">🔥 Top Nachrücker für ${gapMin}min ${thName?'bei '+thName:''}</span><span style="cursor:pointer;color:var(--muted);font-size:14px" onclick="document.getElementById('gapNR').innerHTML='';document.querySelectorAll('.ac-p').forEach(b=>b.style.background='')">✕</span></div>`;
  if(!top.length){h+=`<div style="padding:8px;color:var(--muted);font-size:11px">Kein Heilmittel passt in ${gapMin}min</div>`;}
  top.forEach((it,i)=>{
    const reasons=it.reasons||[];let badges='';reasons.forEach(r=>{const cc=r.includes('BVB')||r.includes('LVB')?'c-green':r.includes('Blanko')?'c-purple':r.includes('Post')?'c-amber':r.includes('+')?'c-blue':'c-fire';badges+=`<span class="pr-b ${cc}">${r}</span>`;});
    const hintStr=it._hints?it._hints.join(' · '):'';
    h+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card);border-radius:10px;margin-bottom:3px;border:1px solid var(--border)">`;
    h+=`<div style="font-family:Montserrat;font-size:14px;font-weight:900;color:var(--fire);width:22px;text-align:center;flex-shrink:0">${i+1}</div>`;
    h+=`<div style="flex:1;min-width:0"><div style="font-family:Montserrat;font-size:12px;font-weight:800">${it.name}</div><div style="font-size:9px;color:var(--muted)">${it.detail}</div>`;
    if(hintStr)h+=`<div style="font-size:8px;color:var(--teal);margin-top:1px">${hintStr}</div>`;
    h+=`</div>`;
    h+=`<div style="display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;max-width:120px;flex-shrink:0">${badges}</div>`;
    h+=`<div style="font-family:Montserrat;font-size:11px;font-weight:800;color:var(--fire);flex-shrink:0;padding:3px 8px;background:var(--fire-bg);border-radius:100px">${it._gapScore}pt</div>`;
    h+=`</div>`;
  });
  if(noFit.length){
    const rejectedDauer=noFit.length-rejectedFreq-rejectedTherapeut;
    const reasons=[];
    if(rejectedDauer>0)reasons.push(rejectedDauer+' zeitlich unpassend');
    if(rejectedFreq>0)reasons.push(rejectedFreq+' bereits 2+x/Woche');
    if(rejectedTherapeut>0)reasons.push(rejectedTherapeut+' kein Bezug zu '+thName);
    // Rausgefilterte im globalen State speichern für den Toggle
    window._lastGapRejected=noFit;
    window._lastGapThName=thName;
    h+=`<div style="margin-top:10px;padding:8px 4px;border-top:1px dashed rgba(239,68,68,.2);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">`;
    h+=`<span style="font-size:10px;color:var(--muted)">${noFit.length} Patienten ausgefiltert · ${reasons.join(' · ')}</span>`;
    h+=`<button onclick="toggleGapRejected(this)" style="padding:4px 12px;border:1.5px solid var(--muted);background:#fff;border-radius:100px;font-family:Montserrat;font-size:10px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap">👁 Trotzdem anzeigen</button>`;
    h+=`</div>`;
    h+=`<div id="gapRejectedList" style="display:none;margin-top:6px"></div>`;
  }
  h+=`</div>`;
  el.innerHTML=h;
}

function analyzeRezepte(tp,beh,pl,bereich,ergoDet,refDate){
  const nm={};if(pl&&Array.isArray(pl))pl.forEach(p=>{if(p.Id)nm[p.Id]=(p.Nachname||'')+', '+(p.Vorname||'');});
  const ergoDG=buildErgoDGMap(ergoDet);
  const pi={};tp.forEach(t=>{if(!t.PatientId)return;const id=t.PatientId;if(!pi[id])pi[id]={name:(t.PatientNachname||'')+', '+(t.PatientVorname||''),termine:[]};pi[id].termine.push({beginn:t.Beginn,ende:t.Ende,bez:t.Bezeichnung,ma:t.Mitarbeiter});});
  const now=new Date();Object.values(pi).forEach(p=>{p.termine.sort((a,b)=>new Date(a.beginn)-new Date(b.beginn));p.nextTermin=p.termine.find(t=>new Date(t.beginn)>=new Date(now.toDateString()))||p.termine[0];});
  const rd=refDate?new Date(refDate+'T00:00:00'):new Date();rd.setHours(0,0,0,0);
  const rdPlus1=new Date(rd);rdPlus1.setDate(rdPlus1.getDate()+1);
  const rdMinus1=new Date(rd);rdMinus1.setDate(rdMinus1.getDate()-1);
  const cat={bvb:[],blanko:[],folge:[],reserv:[],freq:[],nr:[]};
  beh.forEach(p=>{
    const pid=p.patientId;const d=p.data||{};const vos=d.Verordnungen||[];const rv=d.Terminreservierungen||[];
    const inf=pi[pid]||{name:nm[pid]||'Unbekannt',nextTermin:null,termine:[]};
    const act=vos.filter(v=>!v.IsReadOnly&&(!bereich||v.Bereich===bereich));
    if(!act.length){const fr=rv.filter(r=>(r.Beginn||'')>now.toISOString().split('T')[0]);if(fr.length>0)cat.reserv.push({name:inf.name,detail:'Termine ohne Rezept',hint:'Rezept mitbringen?',termin:inf.nextTermin,badge:fr.length+'',badgeC:'c-amber'});return;}
    if(!inf.nextTermin){const at=[];vos.forEach(v=>{(v.Termine||[]).forEach(t=>{if(t.Status===1&&t.Datum)at.push(t);});});at.sort((a,b)=>new Date(a.Datum)-new Date(b.Datum));const nb=at.find(t=>new Date(t.Datum)>=new Date(now.toDateString()));if(nb)inf.nextTermin={beginn:nb.Datum};}
    let pB=null,pBl=false,pBP=false,pPO=false,pFr=null,pG=0,pE=0,pT=0;const mH=hMHM(act);let aB=[];
    let vosTotal=0,vosHB=0; // Hausbesuch-Zähler: aktive Verordnungen gesamt + davon Hausbesuch
    act.forEach(v=>{
      const icd=v.ErsterIcd10;const be=v.Beschreibung||'';const roi=v.ReadOnlyInformation||{};const isB=roi.IsBlankoverordnung||false;
      const te=v.Termine||[];const gp=te.filter(t=>t.Status===1).length;const er=te.filter(t=>t.Status===4).length;const to=te.length;
      pG+=gp;pE+=er;pT+=to;aB.push(be);const bvb=fBVB(icd);
      // Hausbesuch-Check: Beschreibung + Heilmittel der Verordnung
      vosTotal++;if(isHB(v))vosHB++;
      if(bvb&&bvb.t!=='KEIN'){pB=bvb;cat.bvb.push({name:inf.name,icd,beschr:be,detail:`${bvb.t}: ${bvb.n}${bvb.h?' ('+bvb.h+')':''}`,hint:`Arzt kann bis ${bvb.vo} verordnen`,termin:inf.nextTermin,gep:gp,erb:er,tot:to,badge:bvb.t,badgeC:'c-green'});}
      if(isBP(icd)&&!isB){pBP=true;cat.blanko.push({name:inf.name,icd,beschr:be,detail:'Schulter → Blanko (16 Wo)',hint:'Arzt → Blanko-Umstellung',termin:inf.nextTermin,gep:gp,erb:er,tot:to,badge:'Blanko',badgeC:'c-purple'});}
      if(bereich===1&&!isB&&v.Id&&ergoDG[v.Id]){const dg=ergoDG[v.Id];if(['PS3','PS4','SB1'].includes(dg)){pBP=true;cat.blanko.push({name:inf.name,icd,beschr:be,detail:'Ergo '+dg+' → Blanko möglich (16 Wo)',hint:'Arzt → Blanko-Umstellung empfohlen',termin:inf.nextTermin,gep:gp,erb:er,tot:to,badge:'Ergo-Blanko',badgeC:'c-purple'});}}
      if(isB)pBl=true;if(isPO(icd))pPO=true;
      if(gp<=2&&to>0)cat.folge.push({name:inf.name,icd,beschr:be,detail:`Noch ${gp}`,hint:'Folgerezept!',termin:inf.nextTermin,gep:gp,erb:er,tot:to,badge:gp===0?'Leer':'Noch '+gp,badgeC:'c-red'});
      const fr=aFreq(te);if(fr&&fr.avg>=7&&gp>=4){pFr=fr;cat.freq.push({name:inf.name,icd,beschr:be,detail:`~${fr.pw}x/Wo`,hint:'Frequenz↑?',termin:inf.nextTermin,gep:gp,erb:er,tot:to,badge:fr.pw+'x/Wo',badgeC:'c-blue'});}
      if(!pFr&&fr)pFr=fr;
    });
    const td=new Date(rd);const tm2=new Date(rdPlus1);const yd=new Date(rdMinus1);
    let hR=(inf.termine||[]).some(t=>{const d=new Date(t.beginn);d.setHours(0,0,0,0);return d>=yd&&d<=tm2;});
    if(!hR)act.forEach(v=>{(v.Termine||[]).forEach(t=>{if(t.Status===1&&t.Datum){const d=new Date(t.Datum);d.setHours(0,0,0,0);if(d>=yd&&d<=tm2)hR=true;}});});
    let sc=0;const re=[];if(pB){sc+=3;re.push(pB.t);}if(pBl){sc+=3;re.push('Blanko');}if(pBP){sc+=2;re.push('Blanko mögl.');}if(pPO){sc+=3;re.push('Post-OP');}if(mH){sc+=2;re.push(mH.join('+'));}if(pFr&&pFr.avg>=7){sc+=2;re.push(pFr.pw+'x/Wo');}if(pG>6){sc+=1;re.push(pG+' offen');}
    if(sc>=2&&!hR){
      // Hausbesuch-Filter: Patienten mit AUSSCHLIESSLICH Hausbesuch-Verordnungen
      // sind keine sinnvollen Nachrücker für Praxislücken → überspringen
      const onlyHB=(vosTotal>0&&vosHB===vosTotal);
      if(onlyHB)return;
      const hmD=aB.length?Math.max(...aB.map(b=>getHMDauer(b))):20;
      // Stammtherapeut-Definition:
      //   Rückwärts: Termine der letzten 6 Monate (Status 4 = erbracht oder jeder Status mit Datum)
      //   Vorwärts: ALLE zukünftigen geplanten Termine (Status 1) aus den Rezepten
      const thHist=new Set();
      const today=new Date();today.setHours(0,0,0,0);
      const sixMonthsAgo=new Date(today);sixMonthsAgo.setMonth(sixMonthsAgo.getMonth()-6);
      act.forEach(v=>{(v.Termine||[]).forEach(t=>{
        if(!t.MitarbeiterName||!t.Datum)return;
        const d=new Date(t.Datum);
        // Vergangene Termine: nur wenn innerhalb der letzten 6 Monate
        // Zukünftige Termine: immer zählen (egal wie weit in der Zukunft)
        if(d>=today||(d>=sixMonthsAgo&&d<today)){
          thHist.add(t.MitarbeiterName);
        }
      });});
      // Zusätzlich: Termine aus den TP-JSONs (heute/morgen) — Fallback, falls nicht in behData
      (inf.termine||[]).forEach(t=>{if(t.ma)(t.ma).forEach(m=>{if(m.Vorname||m.Nachname)thHist.add(((m.Vorname||'')+' '+(m.Nachname||'')).trim());});});
      const allDates=[];act.forEach(v=>{(v.Termine||[]).forEach(t=>{if(t.Datum&&t.Status===4)allDates.push(t.Datum);});});
      const tPat=analyzeTimePattern(allDates);
      cat.nr.push({name:inf.name,icd:act[0]?.ErsterIcd10||'—',detail:re.join(' · '),hint:pFr?`~${pFr.pw}x/Wo`:'Mehr möglich',termin:inf.nextTermin,gep:pG,erb:pE,tot:pT,score:sc,reasons:re,badge:sc+'',badgeC:'c-fire',tags:{bvb:!!pB,blanko:pBl||pBP,postop:pPO,multi:!!mH},_hmDauer:hmD,_thHistory:[...thHist],_timePat:tPat,_freqPerWeek:pFr?pFr.pw:0});
    }
  });
  cat.nr.sort((a,b)=>b.score-a.score);return cat;
}

// Prüft ob ein Rezept/Termin als Hausbesuch markiert ist
// Checks: explizite Felder, Beschreibungstexte, Heilmittel-Bezeichnungen
function isHB(v){
  if(!v)return false;
  // Direkte Boolean-Flags (verschiedene Schreibweisen)
  if(v.IstHausbesuch===true||v.Hausbesuch===true||v.AlsHausbesuch===true)return true;
  if(v.Behandlungsort&&/hausbesuch/i.test(v.Behandlungsort))return true;
  if(v.Beschreibung&&/hausbesuch/i.test(v.Beschreibung))return true;
  // Hausbesuch-Objekt mit Pauschalen-ID = aktiver Hausbesuch
  if(v.Hausbesuch&&typeof v.Hausbesuch==='object'){
    if(v.Hausbesuch.PositionsnummerHausbesuchPauschaleId)return true;
    if(v.Hausbesuch.EntfernungInKilometern>0)return true;
  }
  if(v.Details){
    if(v.Details.IstHausbesuch===true||v.Details.Hausbesuch===true||v.Details.AlsHausbesuch===true)return true;
    if(v.Details.Behandlungsort&&/hausbesuch/i.test(v.Details.Behandlungsort))return true;
  }
  // Heilmittel checken
  if(v.VerordneteHeilmittel&&Array.isArray(v.VerordneteHeilmittel)){
    for(const hm of v.VerordneteHeilmittel){
      if(hm.Bezeichnung&&/hausbesuch/i.test(hm.Bezeichnung))return true;
      if(hm.Kurzbezeichnung&&/hausbesuch|^hb$/i.test(hm.Kurzbezeichnung))return true;
      if(hm.AlsHausbesuch===true)return true;
    }
  }
  return false;
}

function getErgoPatients(){
  if(!ergoDetailData||!Array.isArray(ergoDetailData))return[];
  const pts={};
  ergoDetailData.forEach(e=>{
    const p=e.Verordnung?.Patient;const d=e.Verordnung?.Details;if(!p?.Id)return;
    if(!pts[p.Id])pts[p.Id]={name:p.Nachname+', '+p.Vorname,nachname:p.Nachname,vorname:p.Vorname,ort:p.Ort||'',geb:p.Geburtsdatum||'',dg:new Set(),heilmittel:new Set(),blanko:false,active:0,hausbesuch:false,praxis:false};
    if(d?.Diagnosegruppe)pts[p.Id].dg.add(d.Diagnosegruppe);
    if(!e.Verordnung.IsReadOnly)pts[p.Id].active++;
    if(d?.IsBlankoformular)pts[p.Id].blanko=true;
    (e.VerordneteHeilmittel||[]).forEach(hm=>{if(hm.Kurzbezeichnung)pts[p.Id].heilmittel.add(hm.Kurzbezeichnung);});
    // Hausbesuch-Erkennung: prüft Verordnung + Heilmittel
    const hbCheck={...e.Verordnung,VerordneteHeilmittel:e.VerordneteHeilmittel,Details:d};
    if(isHB(hbCheck))pts[p.Id].hausbesuch=true;
    else pts[p.Id].praxis=true;
  });
  return Object.values(pts).sort((a,b)=>a.nachname.localeCompare(b.nachname));
}

  if(allDGs.length){
    h+=`<div style="margin-bottom:6px"><div style="font-family:Montserrat;font-size:8px;font-weight:800;color:var(--muted);letter-spacing:1px;margin-bottom:3px">DIAGNOSEGRUPPE <span style="color:var(--red);font-weight:600;margin-left:4px;cursor:pointer" onclick="epClearDG()">✕ zurücksetzen</span></div>`;
    h+=`<div style="display:flex;gap:4px;flex-wrap:wrap">`;

    h+=`<div class="pr-bs" style="max-width:180px">${ortBadge}${dgBadge}${statusBadge}</div>`;
    h+=`</div>`;
  });
  document.getElementById('rd').innerHTML=h;
}

function epApplyFilter(){
  const{status,dgs,hms,orts}=window._epState;
  const dgArr=[...dgs],hmArr=[...hms],ortArr=[...orts];
  let visible=0,total=0;
  document.querySelectorAll('.ep-r').forEach(r=>{
    total++;
    const d=r.dataset.ep||'',dgd=r.dataset.dg||'',hmd=r.dataset.hm||'',ortd=r.dataset.ort||'';
    // Status-Filter
    let ok=true;
    if(status==='active')ok=d.includes('active');
    else if(status==='blanko')ok=d.includes('blanko');
    else if(status==='inactive')ok=d.includes('inactive');
    // DG-Filter (UND: jede ausgewählte DG muss im Patienten vorhanden sein)
    if(ok&&dgArr.length)ok=dgArr.every(dg=>dgd.includes('|'+dg+'|'));
    // HM-Filter (UND: jedes ausgewählte HM muss im Patienten vorhanden sein)
    if(ok&&hmArr.length)ok=hmArr.every(hm=>hmd.includes('|'+hm+'|'));
    // Ort-Filter (ODER bei mehreren: z.B. Praxis ODER Hausbesuch — sinnvoller als UND)
    if(ok&&ortArr.length)ok=ortArr.some(o=>ortd.includes('|'+o+'|'));
    r.style.display=ok?'':'none';
    if(ok)visible++;
  });
  const c=document.getElementById('epCount');if(c)c.textContent=visible;
}

const ICD_RE=/^[A-Z]\d{2}(\.\d{1,4})?-?$/;
function renderChecker(){
  let h=`<div style="max-width:560px;margin:0 auto"><div class="summary" style="background:linear-gradient(135deg,#7c3aed,#5b21b6)"><h2>🔍 Rezept-Checker</h2><div style="font-size:12px;opacity:.9;margin-bottom:12px">ICD-10 eingeben → sofort prüfen</div><div style="display:flex;gap:6px"><input type="text" id="icdIn" placeholder="z.B. M75.1, G35.1..." style="flex:1;padding:10px 16px;border:none;border-radius:100px;font-size:14px;font-family:Montserrat;font-weight:700;text-transform:uppercase;outline:none;color:#020101" oninput="checkICD()"><button onclick="checkICD()" style="padding:10px 20px;border:none;border-radius:100px;background:#fff;color:#7c3aed;font-family:Montserrat;font-size:12px;font-weight:800;cursor:pointer">Prüfen</button></div></div><div id="chkR"></div></div>`;

function checkICD(){
  const raw=document.getElementById('icdIn').value.trim().toUpperCase().replace(/\s+/g,'');
  if(!raw){document.getElementById('chkR').innerHTML='';return;}
  if(!ICD_RE.test(raw)){document.getElementById('chkR').innerHTML=`<div style="background:var(--red-bg);border-radius:16px;padding:16px;margin-top:12px"><span style="color:var(--red)">❌ Ungültiger ICD-10</span></div>`;return;}
  const res=[];const bvb=fBVB(raw);
  if(bvb&&bvb.t!=='KEIN'){const isL=bvb.t==='LVB';res.push({icon:'🏥',title:bvb.t+': '+bvb.n,color:'var(--teal)',bg:'var(--teal-bg)',details:[`Bis <b>${bvb.vo}</b> pro Rezept`,isL?'<b>Dauerhaft</b> verordnungsfähig':'<b>Nicht im Budget</b>',bvb.h?`⚠️ ${bvb.h}`:null].filter(Boolean)});}
  else if(bvb&&bvb.t==='KEIN')res.push({icon:'❌',title:bvb.n,color:'var(--muted)',bg:'#f5f5f5',details:['Kein BVB']});
  if(isBP(raw))res.push({icon:'💊',title:'Blanko möglich!',color:'#7c3aed',bg:'rgba(124,58,237,.08)',details:['<b>16 Wochen</b> gültig','Therapeut bestimmt alles','Arzt → Blanko-Umstellung']});

function parseAuslastung(data){
  const kwRow=data[2]||[],monthRow=data[1]||[],physioSum=data[19]||[];
  let ergoSum=null;
  for(let i=21;i<Math.min(data.length,35);i++){if(data[i]&&data[i][0]&&String(data[i][0]).includes('Summe')){ergoSum=data[i];break;}}
  const kws=[];let col=5,lastP=null;
  while(col<kwRow.length){
    const kw=kwRow[col];
    if(kw&&typeof kw==='number'&&kw>0&&kw<53){
      const ac=col+2,pv=physioSum[ac],ev=ergoSum?ergoSum[ac]:null,mo=monthRow[col]||'';
      if(pv&&typeof pv==='number'&&pv>0&&pv<=1.5){
        const pp=Math.round(pv*1000)/10;
        const isReal=lastP===null||Math.abs(pp-lastP)>0.01;
        if(!isReal)break;
        lastP=pp;
        kws.push({kw:Math.round(kw),physio:pp,ergo:(ev&&typeof ev==='number'&&ev>0&&ev<=1.5)?Math.round(ev*1000)/10:null,month:String(mo)});
      }
      col+=4;
    }else col++;
  }
  return kws;
}

function analyzePatients(rows){
  const P={};
  for(const r of rows){if(!r.patient||!r.datum)continue;const k=r.patient+'||'+r.standort;if(!P[k])P[k]={patient:r.patient,therapeut:r.therapeut,standort:r.standort,lastDate:null,treatments:[],openAmount:0,openCount:0,totalCount:0};const p=P[k];p.treatments.push(r);p.totalCount++;if(!r.abgerechnet){p.openCount++;p.openAmount+=r.preis;}if(!p.lastDate||r.datum>p.lastDate){p.lastDate=r.datum;p.therapeut=r.therapeut;}}
  overduePatients=Object.values(P).filter(p=>p.openCount>0);
  overduePatients.forEach(p=>p.treatments.sort((a,b)=>b.datum-a.datum));
}

async function autoDetectWLPatients(allRows){
  const now=new Date(),cutoff=new Date(now.getTime()-21*24*60*60*1000);
  const patients={};
  for(const r of allRows){if(!r.patient||!r.datum||r.abgerechnet)continue;if(/Hausbesuch|Ausfallrechnung|PhFiP.?Club|FBE/i.test(r.leistung))continue;const k=r.patient;if(!patients[k])patients[k]={patient:r.patient,therapeut:r.therapeut,standort:r.standort,lastDate:null,leistung:r.leistung};if(!patients[k].lastDate||r.datum>patients[k].lastDate){patients[k].lastDate=r.datum;patients[k].therapeut=r.therapeut;patients[k].leistung=r.leistung;patients[k].standort=r.standort;}}
  const existing=new Set(wlData.map(w=>w.patient.toLowerCase()));
  const autoPatients=Object.values(patients).filter(p=>p.lastDate&&p.lastDate<cutoff&&!existing.has(p.patient.toLowerCase()));
  if(!autoPatients.length)return;
  const user='🤖 System';const nowStr=new Date().toLocaleDateString('de-DE');
  const did=drives.kimojo;if(!did)return;
  let nextRow=wlData.length+2;
  for(const p of autoPatients.slice(0,50)){const daysAgo=Math.floor((now-p.lastDate)/(864e5));const fd=p.lastDate.toLocaleDateString('de-DE');const values=[p.patient,'',pName(p.therapeut),p.standort,'Normal','Auto-Erkannt','Flexibel',`Seit ${daysAgo} Tagen kein Termin`,'Neu',p.leistung,fd,String(daysAgo),nowStr,user];try{await writeWLRow(nextRow,values);nextRow++;}catch(e){console.warn('Auto-write:',e);}}
  await loadWL();
}

  h+=`<div class="hk"><div class="hk-l">Kontaktiert</div><div class="hk-v" style="color:var(--amber)">${kontaktiert}</div><div class="hk-sub">📞 In Bearbeitung</div></div>`;
  h+=`<div class="hk"><div class="hk-l">Eingeplant</div><div class="hk-v" style="color:var(--teal)">${eingeplant}</div><div class="hk-sub">📅 Termin steht</div></div>`;
  h+=`<div class="hk"><div class="hk-l">Auto-Erkannt</div><div class="hk-v" style="color:var(--blue)">${auto}</div><div class="hk-sub">🤖 Systemvorschlag</div></div>`;
  h+=`</div>`;
  h+=`<div class="flt"><span class="fl">Ansicht</span><button class="fb ${wlView==='all'?'a':''}" data-wv="all" onclick="setWLView('all',this)">Alle</button><button class="fb ${wlView==='KIMOJO'?'a':''}" data-wv="KIMOJO" onclick="setWLView('KIMOJO',this)"><span class="dot" style="background:var(--red)"></span>KIMOJO</button><button class="fb ${wlView==='PHFIP'?'a':''}" data-wv="PHFIP" onclick="setWLView('PHFIP',this)"><span class="dot" style="background:var(--teal)"></span>PHFIP</button><div class="sep"></div><span class="fl">Status</span><button class="fb ${wlStatusFilter==='all'?'a':''}" data-ws="all" onclick="setWLStatus('all',this)">Alle</button><button class="fb ${wlStatusFilter==='Neu'?'a':''}" data-ws="Neu" onclick="setWLStatus('Neu',this)">🆕 Neu</button><button class="fb ${wlStatusFilter==='Kontaktiert'?'a':''}" data-ws="Kontaktiert" onclick="setWLStatus('Kontaktiert',this)">📞 Kontaktiert</button><button class="fb ${wlStatusFilter==='Eingeplant'?'a':''}" data-ws="Eingeplant" onclick="setWLStatus('Eingeplant',this)">📅 Eingeplant</button><div class="sep"></div><input type="text" class="search" id="wlSearch" value="${esc(search)}" placeholder="Patient suchen..." oninput="renderWL()"></div>`;
  h+=`<div class="wl-card"><div class="thd"><h4>➕ Neuer Eintrag</h4><button class="wl-add" onclick="toggleWLForm()" id="wlFormToggle">Formular öffnen</button></div><div id="wlFormWrap" style="display:none;margin-top:12px"><div class="wl-form"><input class="wl-input" id="wlName" placeholder="Patient Name *"><input class="wl-input" id="wlPhone" placeholder="Telefon"><input class="wl-input" id="wlTherapeut" placeholder="Therapeut"><select class="wl-select" id="wlStandort"><option>KIMOJO #1</option><option>KIMOJO #2</option><option>KIMOJO #3</option><option>Ergotherapie</option><option>PHFIP</option></select><select class="wl-select" id="wlPrio"><option>Dringend</option><option selected>Normal</option><option>Niedrig</option></select><select class="wl-select" id="wlKat"><option>Manuell</option><option>Folgerezept</option><option>Terminwunsch</option></select><select class="wl-select" id="wlZeit"><option>Flexibel</option><option>Vormittag</option><option>Nachmittag</option></select><input class="wl-input" id="wlNote" placeholder="Notiz..."><button class="wl-add" onclick="addWLEntry()">+ Speichern</button></div></div></div>`;

  if(!F.length){h+='<div class="tcx"><div class="wl-empty">Keine Einträge'+(wlStatusFilter!=='all'?' mit diesem Status':'')+'</div></div>';container.innerHTML=h;return;}
  h+=`<div class="tcx"><div class="thd"><h3>Warteliste</h3><span class="cnt">${F.length} Patienten</span></div><table class="data-t"><thead><tr><th>Patient</th><th>Telefon</th><th>Therapeut</th><th>Standort</th><th>Prio</th><th>Zeitwunsch</th><th>Notiz</th><th>Status</th><th class="r">Tage</th><th></th></tr></thead><tbody>`;
  const priCls=p=>p==='Dringend'?'b-red':p==='Niedrig'?'b-teal':'b-amber';
  F.forEach(w=>{const sCls=sC(w.standort);const isAuto=w.kategorie==='Auto-Erkannt';const rowBg=isAuto?' style="background:var(--blue-bg)"':'';
    const statusBtns=`<button class="act ${w.status==='Neu'?'done':''}" onclick="updateWLStatus(${w.row},'Neu')" title="Neu">🆕</button><button class="act ${w.status==='Kontaktiert'?'done':''}" onclick="updateWLStatus(${w.row},'Kontaktiert')" title="Kontaktiert">📞</button><button class="act ${w.status==='Eingeplant'?'done':''}" onclick="updateWLStatus(${w.row},'Eingeplant')" title="Eingeplant">📅</button><button class="act" onclick="deleteWLRow(${w.row})" title="Erledigt">✅</button>`;
    h+=`<tr${rowBg}><td><div class="pn">${esc(w.patient)}</div>${w.leistung?`<div class="th-sub">${esc(w.leistung)}</div>`:''}</td><td>${w.telefon?`<a href="tel:${esc(w.telefon)}" style="color:var(--red);font-weight:600">${esc(w.telefon)}</a>`:'—'}</td><td>${esc(w.therapeut)}</td><td><span class="standort ${sCls}">${esc(w.standort)}</span></td><td><span class="badge ${priCls(w.prio)}">${esc(w.prio)}</span></td><td style="font-size:10px">${esc(w.zeitwunsch)}</td><td style="font-size:10px;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(w.notiz)}">${esc(w.notiz)}</td><td>${statusBtns}</td><td class="r">${w.tageHer?`<span class="days">${esc(w.tageHer)}</span>`:''}</td></tr>`;
  });
  h+=`</tbody></table></div>`;
  container.innerHTML=h;
}
</script>
</body>
</html>
